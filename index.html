<!DOCTYPE html>
<html lang="en" data-theme="codex">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Studio</title>
  <link rel="icon" type="image/svg+xml" href="/src/assets/logo-emblem.svg">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body class="bg-dark text-light">
  <div id="app" class="ui-app-shell">
    <!-- Header — app identity + auth only -->
    <header class="ui-header">
      <button id="sidebar-toggle" class="sidebar-toggle" type="button"
        aria-label="Show navigation" aria-controls="sidebar" aria-expanded="false">
        <span class="hamburger" aria-hidden="true"></span>
      </button>
      <div class="ui-header-brand">
        <button id="brand-home" class="brand-home" type="button" aria-label="Codex Studio — go to home" title="Home">
          <img class="brand-wordmark" src="/src/assets/logo-wordmark.svg" alt="">
        </button>
      </div>

      <div class="ui-header-actions">
        <!-- App-wide run-mode / sync-health signal (cloud vs local). One holder, always visible —
             it's application state, not per-entry, so it lives here rather than in a view header. -->
        <div id="active-file-indicator" class="compliance-badge is-local" data-sync-badge>
          <span class="idle-dot"></span> <span class="sync-label">Local only</span>
        </div>
        <div id="user-profile-badge" class="user-badge-container">
          <button id="btn-google-login" class="ui-btn">Sign in with Google</button>
        </div>
      </div>
    </header>

    <!-- Private Auth Gateway Container (Shown if logged out/unauthorized) -->
    <div id="gateway-container" class="hidden"></div>

    <!-- App body: sidebar nav + content workspace (Shown when authenticated) -->
    <div class="ui-app-body">
      <!-- Left sidebar: codex switcher → types → entries. Admin lives in the header user menu. -->
      <aside id="sidebar" class="ui-sidebar">
        <!-- Pinned top: codex switcher, role signal, entry search (kit sidebar-header, stacked). -->
        <div class="ui-sidebar-header codex-sidebar-top">
          <div class="codex-switcher-wrap">
            <button id="codex-switcher" class="codex-switcher" disabled title="Switch codex">
              <span id="codex-switcher-label" class="codex-switcher-label"></span>
              <span class="caret" aria-hidden="true"></span>
            </button>
          </div>

          <!-- Role signal for non-admin users (#22): renders only for editors/viewers -->
          <div id="role-badge" class="role-badge" hidden></div>

          <div class="nav-search-wrap">
            <input id="nav-search" class="nav-search" type="search" placeholder="Search entries…"
              autocomplete="off" spellcheck="false" aria-label="Search entries">
          </div>
        </div>

        <!-- Scrolling nav region: types (from listTypes) → entries, then Admin. -->
        <nav id="type-nav" class="type-nav ui-sidebar-body" aria-label="Codex contents"></nav>
      </aside>

      <!-- Scrim behind the off-canvas sidebar drawer (small screens only, #8). -->
      <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

      <!-- Content workspace -->
      <main id="main-workspace" class="app-workspace view-content-read">
        <!-- Editor (form) panel — full-width in builder edit mode; left panel in admin -->
        <section class="editor-panel glass-card">
          <div class="editor-header">
            <!-- Mirrors the Structure editor's toolbar: Back leads the breadcrumb title on the left;
                 the trailing cluster is Preview (on-demand live entry preview) · ⋯ More (History /
                 Archive / Delete) · primary Save. -->
            <div class="editor-toolbar-start">
              <button id="btn-done-edit" class="ui-btn" data-size="sm">Back</button>
              <h2 id="editor-title" class="panel-title"></h2>
            </div>
            <div class="editor-actions">
              <button id="btn-preview-entry" class="ui-btn" data-size="sm" type="button" aria-pressed="false">Preview</button>
              <div class="overflow-menu">
                <button id="btn-entry-menu" class="ui-btn" data-size="sm" type="button" popovertarget="entry-menu-list" aria-haspopup="menu" aria-expanded="false" aria-label="More actions">⋯<span class="ee-label-wide"> More</span></button>
                <div id="entry-menu-list" popover class="ui-popover overflow-menu-popover" role="menu" aria-label="More entry actions">
                  <div class="ui-menu">
                    <button id="btn-history-entry" class="ui-menu-item" role="menuitem" type="button" hidden>History</button>
                    <button id="btn-archive-entry" class="ui-menu-item" role="menuitem" type="button" hidden>Archive</button>
                    <button id="btn-delete-entry" class="ui-menu-item overflow-menu-danger" role="menuitem" type="button" hidden>Delete</button>
                  </div>
                </div>
              </div>
              <button id="btn-save-entry" class="ui-btn" data-intent="primary" data-size="sm">Save</button>
            </div>
          </div>
          <div id="form-container" class="form-scrollable">
            <!-- Active Form / admin panel rendered here -->
          </div>
        </section>

        <!-- Reader / preview panel — full-width reader in read mode; preview+raw in admin -->
        <section class="reader-panel glass-card">
          <div class="reader-header">
            <h2 id="reader-title" class="panel-title"></h2>
            <div class="reader-actions">
              <button id="btn-structure" class="ui-btn" data-size="sm" hidden>Structure</button>
              <button id="btn-edit-toggle" class="ui-btn" data-intent="primary" data-size="sm" hidden>Edit</button>
              <!-- Dismiss the on-demand live-preview column — shown for both the Structure editor and
                   the entry editor (whichever opened it). Opening it lives on each editor's Preview
                   toggle (Structure also reveals raw JSON via More ▸ Edit JSON). -->
              <button id="btn-close-preview" class="ui-btn" data-size="sm" type="button" hidden title="Hide the preview">✕ Close</button>
            </div>
          </div>

          <div id="preview-content-rendered" class="preview-content reader-body">
            <!-- Rendered reading view -->
          </div>
          <div id="preview-content-raw" class="preview-content raw-body hidden">
            <textarea id="raw-json-textarea" spellcheck="false"></textarea>
            <div id="json-error" class="json-error hidden"></div>
          </div>
        </section>
      </main>
    </div>

    <!-- Notification Toast -->
    <div id="toast-container" class="ui-toast-region" data-position="bottom-end"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
