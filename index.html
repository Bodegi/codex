<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Studio</title>
  <link rel="icon" type="image/svg+xml" href="/src/assets/logo-emblem.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body class="bg-dark text-light">
  <div id="app" class="app-container">
    <!-- Header — app identity + auth only -->
    <header class="app-header">
      <button id="sidebar-toggle" class="sidebar-toggle" type="button"
        aria-label="Show navigation" aria-controls="sidebar" aria-expanded="false">
        <span class="hamburger" aria-hidden="true"></span>
      </button>
      <div class="header-brand">
        <button id="brand-home" class="brand-home" type="button" aria-label="Codex Studio — go to home" title="Home">
          <img class="brand-wordmark" src="/src/assets/logo-wordmark.svg" alt="">
        </button>
      </div>

      <div class="header-actions">
        <!-- App-wide run-mode / sync-health signal (cloud vs local). One holder, always visible —
             it's application state, not per-entry, so it lives here rather than in a view header. -->
        <div id="active-file-indicator" class="compliance-badge is-local" data-sync-badge>
          <span class="idle-dot"></span> <span class="sync-label">Local only</span>
        </div>
        <div id="user-profile-badge" class="user-badge-container">
          <button id="btn-google-login" class="btn btn-secondary">Sign in with Google</button>
        </div>
      </div>
    </header>

    <!-- Private Auth Gateway Container (Shown if logged out/unauthorized) -->
    <div id="gateway-container" class="hidden"></div>

    <!-- App body: sidebar nav + content workspace (Shown when authenticated) -->
    <div class="app-body">
      <!-- Left sidebar: codex switcher → types → entries. Admin lives in the header user menu. -->
      <aside id="sidebar" class="app-sidebar">
        <div class="codex-switcher-wrap">
          <button id="codex-switcher" class="codex-switcher" disabled title="Switch codex">
            <span id="codex-switcher-label" class="codex-switcher-label"></span>
            <span class="caret" aria-hidden="true"></span>
          </button>
        </div>

        <!-- Role signal for non-admin users (#22): renders only for editors/viewers -->
        <div id="role-badge" class="role-badge" hidden></div>

        <div class="nav-search-wrap">
          <input id="nav-search" class="nav-search" type="search" placeholder="Search entries…"
            autocomplete="off" spellcheck="false" aria-label="Search entries">
        </div>

        <nav id="type-nav" class="type-nav" aria-label="Codex contents">
          <!-- Data-driven: types (from listTypes) → entries -->
        </nav>
      </aside>

      <!-- Scrim behind the off-canvas sidebar drawer (small screens only, #8). -->
      <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

      <!-- Content workspace -->
      <main id="main-workspace" class="app-workspace view-content-read">
        <!-- Editor (form) panel — full-width in builder edit mode; left panel in admin -->
        <section class="editor-panel glass-card">
          <div class="editor-header">
            <h2 id="editor-title" class="panel-title"></h2>
            <!-- Right-aligned cluster: auxiliary → nav → primary at the trailing edge (mirrors the
                 reader header's `Structure · Edit`). Destructive Archive stays out of the trailing slot. -->
            <div class="editor-actions">
              <button id="btn-history-entry" class="btn btn-secondary btn-sm" hidden>History</button>
              <button id="btn-archive-entry" class="btn btn-secondary btn-sm" hidden>Archive</button>
              <button id="btn-done-edit" class="btn btn-secondary btn-sm">Back</button>
              <button id="btn-save-entry" class="btn btn-primary btn-sm">Save</button>
            </div>
          </div>
          <div id="form-container" class="form-scrollable">
            <!-- Active Form / admin panel rendered here -->
          </div>
        </section>

        <!-- Reader / preview panel — full-width reader in read mode; preview+raw in admin -->
        <section class="reader-panel glass-card">
          <div class="reader-header">
            <h2 id="reader-title" class="panel-title"></h2>
            <div class="reader-actions">
              <button id="btn-structure" class="btn btn-secondary btn-sm" hidden>Structure</button>
              <button id="btn-edit-toggle" class="btn btn-primary btn-sm" hidden>Edit</button>
              <!-- Structure preview only: dismiss the live-preview column. Entering Structure and
                   switching to raw JSON both live on the editor toolbar (Preview / More ▸ Edit JSON). -->
              <button id="btn-close-preview" class="btn btn-secondary btn-sm" type="button" hidden title="Hide the preview">✕ Close</button>
            </div>
          </div>

          <div id="preview-content-rendered" class="preview-content reader-body">
            <!-- Rendered reading view -->
          </div>
          <div id="preview-content-raw" class="preview-content raw-body hidden">
            <textarea id="raw-json-textarea" spellcheck="false"></textarea>
            <div id="json-error" class="json-error hidden"></div>
          </div>
        </section>
      </main>
    </div>

    <!-- Notification Toast -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
